<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- просим поисковики (Google, Yandex и др.) не показывать сайт в поиске -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>IELTS</title>
<style>
/* ============ Общие цвета и шрифты ============ */
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#d9dee7;
  --brand:#c8102e; --brand2:#a30d25; --blue:#1f5fbf; --ok:#16803c; --okbg:#e5f6ea;
  --bad:#c62828; --badbg:#fdeaea; --warn:#b26a00; --warnbg:#fff4e0;
  /* экран экзамена */
  --x-bg:#fff; --x-ink:#000; --x-panel:#f4f4f4; --x-line:#c9c9c9; --x-accent:#1a73e8;
  --x-fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100%}

/* ============ Главная, редактор, результаты ============ */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.logo{display:inline-flex;align-items:center;justify-content:center;background:var(--brand);color:#fff;font-weight:700;
  letter-spacing:1px;border-radius:6px;padding:6px 10px;font-size:18px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:16px 0 8px}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;line-height:1.2}
.btn:hover{background:#f6f7f9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea.i{font-family:Consolas,Menlo,monospace;font-size:14px;line-height:1.45}
input.n{width:80px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:#eef1f6;color:#344054}
.pill.r{background:#e8f0fe;color:#1a56b8}.pill.l{background:#fdf0e1;color:#9a5400}.pill.w{background:#eaf6ec;color:#1d6b33}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.note{background:var(--warnbg);color:#6b4100;border-radius:8px;padding:10px 12px;font-size:14px}
.okmsg{background:var(--okbg);color:#14532d;border-radius:8px;padding:10px 12px;font-size:14px}
.errmsg{background:var(--badbg);color:#7f1d1d;border-radius:8px;padding:10px 12px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:13px}
.tests{display:grid;gap:10px}
.test{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;flex-wrap:wrap}
.test .nm{font-weight:700}
.test .grow{flex:1;min-width:200px}
.empty{color:var(--muted);text-align:center;padding:20px}
.steps{margin:0;padding-left:20px;line-height:1.6}
.filebox{border:2px dashed var(--line);border-radius:10px;padding:12px;background:#fafbfc}
.filebox .fn{font-weight:600;word-break:break-all}
.keyprev{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.keyprev table td,.keyprev table th{padding:4px 8px}
.kind{font-size:11px;border-radius:4px;padding:1px 6px;background:#eef1f6;white-space:nowrap}
.miss{color:var(--bad);font-weight:600}
.band-big{font-size:56px;font-weight:700;line-height:1;color:var(--brand)}
.stat{display:inline-block;margin-right:28px;vertical-align:top}
.stat b{display:block;font-size:26px}
.c-ok{color:var(--ok);font-weight:700}.c-bad{color:var(--bad);font-weight:700}.c-empty{color:var(--muted)}
tr.ok td{background:#f3fbf5}tr.bad td{background:#fff6f6}
.calc input{width:70px}
#langBar{display:flex;justify-content:flex-end;max-width:1100px;margin:0 auto;padding:12px 16px 0}
#langBar .seg button{padding:6px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;
  z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px;max-width:90vw}

/* ============ Модальные окна ============ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;color:#000;border-radius:10px;max-width:520px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.modal.big{max-width:1000px;height:90vh;display:flex;flex-direction:column;padding:14px}
.modal h3{margin-top:0}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ============ Экран экзамена: повторяет официальный пробный компьютерный IELTS ============ */
#exam,#pre{--x-page:#dbe5f5;--x-panel:#dde3ee;--x-bg:#fff;--x-ink:#000;--x-line:#b8c3d6;--x-accent:#34b2f1;--x-gap:#2f86c8;--x-focus:#cbe5f8;
  font-family:Arial,Helvetica,sans-serif}
#exam{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--x-page);color:var(--x-ink);font-size:var(--x-fs)}
.xtop{height:30px;flex:none;display:flex;align-items:center;padding:0 10px;background:#000;color:#fff;font-size:14px;position:relative}
.xcand{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;max-width:38%}
.xmod{color:#9fd3f5;font-size:12px;margin-left:6px}
.xtimer{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;color:#fff0bd;cursor:pointer;white-space:nowrap;user-select:none}
.xtimer .big{font-size:21px;line-height:1}
.xtimer.red{color:#ff3333}
.xtimer.flash{animation:xflash .5s infinite}
@keyframes xflash{50%{opacity:.15}}
.xicons{margin-left:auto;display:flex;align-items:center;gap:8px}
.xbtn{font-size:14px;padding:3px 14px;background:#6aade4;color:#050608;border:0;border-radius:6px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 1px rgba(255,255,255,.2)}
.xbtn:hover{background:#82bdec}
.xbtn .qm{display:inline-block;background:#fff;color:#2b6cb0;border:1px solid #2b6cb0;font-size:11px;font-weight:700;width:14px;height:14px;
  line-height:13px;text-align:center;margin-left:4px;border-radius:2px;vertical-align:1px}
.xvol{display:flex;align-items:center;gap:4px}
.xvol input{width:64px;accent-color:#fff;cursor:pointer}
.xtitle{flex:none;margin:10px 10px;padding:12px 10.5px;background:var(--x-bg);color:var(--x-ink);font-size:18.5px;font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.xtitle .sub{font-weight:400;font-size:15px;margin-left:10px}
.xreviewtag{background:#ffd54f;color:#000;font-weight:700;padding:2px 10px;border-radius:4px;font-size:13px}
#xAudioSlot{flex:none;margin:0 10px 8px}
#xAudioSlot:empty{display:none}
.xmain{flex:1;display:flex;min-height:0;padding:0 10px 6px}
.xpanel{background:var(--x-panel);border-radius:6px;box-shadow:0 1px 3.5px rgba(0,0,0,.25)}
.xleft{flex:none;width:55%;min-width:220px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.xdiv{flex:none;width:12px;cursor:col-resize;display:flex;align-items:center;justify-content:center}
.xdiv::after{content:"";width:3px;height:40px;border-left:2px dotted #7b8aa3;border-right:2px dotted #7b8aa3}
.xright{flex:1;min-width:260px;overflow:auto;padding:14px 11px 30px}
#exam.full .xleft,#exam.full .xdiv{display:none}
.xfoot{flex:none;height:48px;position:relative}
.xrev{position:absolute;left:8px;bottom:6px;font-size:13px;display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none}
.xqnav{position:absolute;left:84px;right:130px;bottom:0;min-height:40px;background:rgba(255,255,255,.25);border:1px solid #fff;border-bottom:0;
  border-radius:8px 8px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.5);padding:8px 44px 6px 8px;display:flex;align-items:flex-end}
.xqnav ul{margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px}
.xqnav li{list-style:none;width:23px;height:23px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  color:#fff;background:#000;border:1px solid #000;border-radius:2px;cursor:pointer;user-select:none;box-sizing:border-box}
.xqnav li:hover{color:#33bbff}
.xqnav li.newpart{margin-left:8px}
.xqnav li.answered{background:#fff;border-color:#fff;color:#000}
.xqnav li.answered span{border-bottom:2px solid #000;line-height:14px}
.xqnav li.current{background:linear-gradient(#b5e3fb,#4cb6ee);border-color:#34b2f1;color:#0d4f78}
.xqnav li.current.answered span{border-color:#0d4f78}
.xqnav li.review{border-radius:50%}
.xqnav li.r-ok{background:#2e9b4f;border-color:#2e9b4f;color:#fff}
.xqnav li.r-bad{background:#d23b3b;border-color:#d23b3b;color:#fff}
.xqnav.summary{background:transparent;box-shadow:none;border-color:transparent}
.xqnav.summary ul{gap:1px}
.xqnav.summary li{width:14px;height:14px;border-radius:0}
.xqnav.summary li span{display:none}
.xqnav.summary li.current{background:#34b2f1}
.xqnav .pencil{position:absolute;right:6px;bottom:4px;width:32px;height:32px;border:0;background:transparent;cursor:pointer;padding:0}
.xarrow{position:absolute;bottom:3px;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#fff 0,#e3e7ec 55%,#b9c0ca 100%);box-shadow:0 1px 3px rgba(0,0,0,.45)}
.xarrow:hover{filter:brightness(1.05)}
.xarrow.prev{right:62px}.xarrow.next{right:10px}

/* задание прямо на экране (как на экзамене) */
.paper{font-size:1em;line-height:1.5}
.phead{margin:0 0 14px}
.phead h4{font-size:1em;margin:0 0 2px}
.pinstr{font-size:1em}
.pbody{margin:0 0 18px 14px}
.pbody .ptitle{font-weight:700;font-size:1.07em;margin:14px 0 12px}
.pbody table{border-collapse:collapse;margin:6px 0 10px;background:rgba(255,255,255,.35)}
.pbody td,.pbody th{border:1px solid #98a5b9;padding:5px 9px;vertical-align:top;text-align:left}
.pbody th{background:rgba(255,255,255,.55)}
.pbody p{margin:0 0 9px}
.pbody ul{margin:2px 0 10px;padding-left:22px}
.pbody li{margin:0 0 7px}
.gap{display:inline-block;width:117px;height:20px;border:1px solid var(--x-gap);background:var(--x-bg);color:var(--x-ink);border-radius:0;
  font:700 13px Arial,Helvetica,sans-serif;text-align:center;padding:0 3px;vertical-align:middle;margin:1px 3px;box-sizing:border-box;line-height:18px}
.gap::placeholder{color:var(--x-ink);opacity:1;font-weight:700}
.gap:focus,.gap.cur{background:var(--x-focus);border:2px solid #222;outline:none;border-radius:2px}
span.gap{cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:auto;min-width:117px;padding:0 8px}
span.gap.empty{color:var(--x-ink)}
span.gap.over{background:var(--x-focus);border:2px dashed #222}
.gap.ok{border:2px solid #2e9b4f;background:#e3f6e8}
.gap.bad{border:2px solid #d23b3b;background:#fde4e4}
.mark{font-size:.86em;font-weight:700;margin:0 4px;white-space:nowrap}
.mark.ok{color:#1f7a3c}.mark.bad{color:#b42323}
.mark .ca{color:#1f7a3c}
.mcq{display:inline-block;vertical-align:top;width:48.5%;margin:0 1% 22px 0;box-sizing:border-box}
.mcq.wide{display:block;width:100%}
.mcq .qt{margin:8px 0 12px;padding:4px 6px 4px 10px}
.mcq .qt b{margin-right:10px}
.mcq.cur .qt{background:linear-gradient(#e9f7fe,#bfe6fb)}
.mcq label{display:flex;align-items:center;gap:8px;margin:0 0 11px 6px;cursor:pointer;width:fit-content}
.mcq label input{margin:0}
.mcq label.okopt{color:#1f7a3c;font-weight:700}
.mcq label.badopt{color:#b42323;text-decoration:line-through}
.dragwrap{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
.dragwrap .pbody{flex:1;min-width:260px}
.dragopts{min-width:200px}
.dragopts h5{font-size:1.07em;margin:14px 0 18px}
.dragopt{display:block;width:fit-content;padding:2px 14px;margin:0 0 14px;background:linear-gradient(#fff,#e2e7ee);border:1px solid #98a5b9;border-radius:3px;cursor:grab;user-select:none}
.dragopt.sel{outline:2px solid #34b2f1;background:#d7efff}
/* список вопросов (для тестов из PDF) */
.lhead h4{font-size:1em;margin:0 0 2px}
.lhead div{margin:0 0 14px}
.lq{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:3px;flex-wrap:wrap}
.lq.cur{background:linear-gradient(#e9f7fe,#bfe6fb)}
.lq .ln{min-width:24px;text-align:right}
.lopts{display:flex;flex-wrap:wrap;gap:4px 18px}
.lopts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.lopts label.okopt{color:#1f7a3c;font-weight:700}
.lopts label.badopt{color:#b42323;text-decoration:line-through}
mark.hl{background:#ffe866;color:inherit}
/* сопоставление: таблица с кружками (как «Plan/Map/Diagram labelling» на экзамене) */
.pgrid{border-collapse:collapse;margin:6px 0 14px 14px;background:rgba(255,255,255,.45)}
.pgrid th{background:#c6dcf6;border:1px solid #7f8da3;padding:5px 14px;font-weight:700}
.pgrid td{border:1px solid #7f8da3;padding:5px 10px}
.pgrid td.rq b{margin-right:8px}
.pgrid td.cell{text-align:center;cursor:pointer;width:48px}
.pgrid td.cell input{pointer-events:none;margin:0}
.pgrid tr.cur td{background:#d3ebfb}
.pgrid td.ok{background:#d4efda}.pgrid td.bad{background:#f6d4d4}
#exam.c-wb .pgrid th,#exam.c-yb .pgrid th,#exam.c-wb .pgrid tr.cur td,#exam.c-yb .pgrid tr.cur td{background:rgba(52,178,241,.28)}

/* письмо */
.wtask{display:flex;flex-direction:column;height:100%}
.wta{flex:1;min-height:300px;width:100%;resize:none;border:1px solid var(--x-gap);border-radius:2px;padding:10px;line-height:1.6;background:var(--x-bg);color:var(--x-ink);font-size:1em;font-family:Arial,Helvetica,sans-serif}
.wta:focus{outline:2px solid #222}
.wcount{margin-top:6px;font-size:.95em;text-align:right}

/* окна в стиле экзамена: Help, Hide, конец теста */
.xov{position:fixed;inset:0;z-index:160;display:flex;justify-content:center;align-items:flex-start;padding:60px 12px 12px;background:rgba(0,0,0,.4)}
.xov.solid{background:#555}
.xdlg{width:770px;max-width:100%;background:#dbe5f5;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);color:#000;font-family:Arial,Helvetica,sans-serif;
  max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.xdlg h1{margin:0;background:#000;color:#fff;font-size:15px;padding:11px 40px 11px 14px;border-bottom:3px solid #4a4a4a;display:flex;align-items:center;gap:10px;flex:none}
.xdlg h1 .x{position:absolute;right:12px;top:10px}
.xdlg .xclose{margin-left:auto;width:18px;height:18px;border:0;background:#c62828;color:#fff;font-size:12px;line-height:18px;padding:0;border-radius:2px;cursor:pointer}
.xdlg .body{padding:14px 12px 18px;font-size:15px;overflow:auto}
.xdlg .body p{margin:0 0 14px}
.xdlg .acts{display:flex;justify-content:center;gap:12px;padding:0 0 18px;flex:none}
.ibtn{color:#1e415b;font-size:15.4px;font-weight:700;padding:6px 16px;background:linear-gradient(#fff,#dfe5ee);border:1px solid #a9b6c7;border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.25);text-shadow:0 1px 0 #fff;cursor:pointer;font-family:Arial,Helvetica,sans-serif}
.ibtn:hover{background:linear-gradient(#fff,#eef2f7)}
.xtabs{display:flex;gap:6px;border-bottom:1px solid #7f8da3;margin:0 0 14px;padding-left:8px}
.xtabs button{padding:6px 18px;font-size:15px;font-weight:700;border:1px solid #7f8da3;border-bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(#e9eef5,#c3cddb);color:#333;cursor:pointer;margin-bottom:-1px}
.xtabs button.on{background:#dbe5f5;color:#000}
.xdlg h5{font-size:14px;margin:12px 0 8px}
.xdlg .body li{margin:0 0 6px}

/* вступительные экраны (как на экзамене) */
#pre{position:fixed;inset:0;background:var(--x-page);display:flex;flex-direction:column;color:#000;overflow:auto}
#pre .band{height:74px;background:#fff;display:flex;align-items:center;padding:0 14px;flex:none}
.ilogo{font:900 60px/1 Arial,Helvetica,sans-serif;color:#e4173e;letter-spacing:-2px;transform:scaleY(.95)}
#pre .strip{min-height:28px;background:#000;color:#fff;font-size:14px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none}
#pre .strip .xvol{margin-left:auto}
#pre .shade{height:14px;background:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,0));flex:none}
#pre .box{width:760px;max-width:calc(100% - 24px);margin:26px auto 0}
#pre .boxhead{display:flex;align-items:flex-end;gap:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);font-weight:700;font-size:15px;margin:0 0 -4px 8px}
#pre .card{background:transparent;border:1px solid #fff;border-radius:10px;padding:16px 12px 22px;font-size:15px;color:#333;margin:0}
#pre .card p{margin:0 0 8px}
#pre .info{display:flex;align-items:center;gap:8px;margin:14px 0;color:#000}
#pre .info.c{justify-content:center;font-weight:700;color:#444}
#pre .center{text-align:center;margin-top:12px}
#pre .instr{margin:12px 10px;padding:12px 10px 26px;background:var(--x-panel);border-radius:6px;box-shadow:0 1px 3.5px rgba(0,0,0,.25);font-size:14px}
#pre .instr h2{font-size:18px;margin:4px 0 22px}
#pre .instr h3{font-size:16px;margin:22px 0 14px}
#pre .instr ul{margin:0;padding-left:60px}
#pre .instr li{margin:0 0 6px}

/* просмотр PDF */
.pdfview{display:flex;flex-direction:column;flex:1;min-height:0;height:100%}
.pdfbar{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--x-line);font-size:13px;background:var(--x-panel);color:var(--x-ink);flex-wrap:wrap}
.pdfbar button{border:1px solid var(--x-line);background:var(--x-bg);color:var(--x-ink);border-radius:3px;min-width:30px;height:28px;padding:0 8px}
.pdfbar .sp{flex:1}
.pdfscroll{flex:1;overflow:auto;padding:12px;position:relative}
.pdfpage{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pdfpage canvas{position:absolute;left:0;top:0}
.pdfpage .pno{position:absolute;right:-2px;top:-2px;transform:translateY(-100%);font-size:11px;opacity:.6;color:var(--x-ink)}
.hlayer{position:absolute;inset:0;pointer-events:none;z-index:1}
.hlayer div{position:absolute;background:rgba(255,230,0,.5);mix-blend-mode:multiply}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(26,115,232,.35)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.hlpop{position:fixed;z-index:120;background:#222;color:#fff;border-radius:6px;display:flex;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hlpop button{background:transparent;border:0;color:#fff;padding:7px 12px;font-size:14px}
.hlpop button:hover{background:#444}
.audiobar{flex:none;padding:8px 12px 6px;background:var(--x-panel);color:var(--x-ink);border-radius:6px;box-shadow:0 1px 3.5px rgba(0,0,0,.25)}
.audiobar .tr{font-size:12px;margin-bottom:6px}
.audiobar .tr select{width:auto;padding:3px 6px;font-size:13px;border:1px solid var(--x-line);border-radius:4px;background:var(--x-bg);color:var(--x-ink)}
/* плеер с точной перемоткой (тренировка и разбор) */
.ap-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ap-btn{min-width:48px;height:34px;border:1px solid var(--x-line);background:var(--x-bg);color:var(--x-ink);border-radius:4px;
  font-size:13px;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ap-btn:hover{border-color:var(--x-accent)}
.ap-play{min-width:56px;font-size:16px;background:var(--x-accent);border-color:var(--x-accent);color:#fff}
.ap-time{font-variant-numeric:tabular-nums;font-size:14px;margin-left:6px;min-width:92px}
.ap-speed{display:inline-flex;border:1px solid var(--x-line);border-radius:4px;overflow:hidden;margin-left:auto}
.ap-speed button{border:0;border-right:1px solid var(--x-line);background:var(--x-bg);color:var(--x-ink);padding:0 8px;height:30px;font-size:12px}
.ap-speed button:last-child{border-right:0}
.ap-speed button.on{background:var(--x-ink);color:var(--x-bg)}
.ap-line{position:relative;margin-top:8px}
.ap-line input{display:block;width:100%;margin:0;height:24px;accent-color:var(--x-accent);cursor:pointer}
.ap-tip{position:absolute;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;font-size:11px;padding:2px 6px;
  border-radius:3px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.ap-hint{font-size:11px;opacity:.6;margin-top:2px}

<script>
'use strict';
/* =====================================================================
   Компьютерный IELTS — тренажёр.
   Один файл: открыть в браузере (Chrome / Edge / Firefox).
   Тесты хранятся в браузере этого компьютера (IndexedDB),
   история результатов — в localStorage.
   ===================================================================== */

/* ---------- мелкие помощники ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === 'class') e.className = v;
    else if(k === 'html') e.innerHTML = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()) if(c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms){
  const t = h('div', {class:'toast'}, msg); document.body.append(t);
  setTimeout(() => t.remove(), ms || 2600);
}
function showScreen(id){
  ['home','editor','intro','pre','exam','results'].forEach(s => $('#'+s).classList.toggle('hidden', s !== id));
  $('#langBar').classList.toggle('hidden', id === 'exam' || id === 'pre');
  window.scrollTo(0,0);
}
/* модальное окно; buttons: [{text, cls, value}] → Promise(value) */
function modal(title, body, buttons, opts){
  opts = opts || {};
  return new Promise(res => {
    const bg = h('div', {class:'modal-bg'});
    const box = h('div', {class:'modal' + (opts.big ? ' big' : '')});
    if(title) box.append(h('h3', null, title));
    if(body) box.append(typeof body === 'string' ? h('div', {html: body}) : body);
    const acts = h('div', {class:'acts'});
    (buttons || [{text:'OK', cls:'primary', value:true}]).forEach(b => {
      acts.append(h('button', {class:'btn ' + (b.cls || ''), onclick: () => { close(); res(b.value); }}, b.text));
    });
    box.append(acts); bg.append(box); $('#modalRoot').append(bg);
    function close(){ bg.remove(); if(opts.onClose) opts.onClose(); }
    if(opts.onOpen) opts.onOpen(box);
  });
}
const confirmBox = (title, text, yes, no) =>
  modal(title, '<p>' + text + '</p>', [{text: no || tr('cancel'), value:false}, {text: yes || tr('yes'), cls:'primary', value:true}]);
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function fmtDate(ts){
  const d = new Date(ts);
  if(LANG === 'uz'){   // в Узбекистане привычно 01.11.2026 14:05
    const z = n => String(n).padStart(2, '0');
    return z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  return d.toLocaleDateString(LOCALES[LANG]) + ' ' + d.toLocaleTimeString(LOCALES[LANG], {hour:'2-digit', minute:'2-digit'});
}
function download(name, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type: type || 'text/plain'});
  const a = h('a', {href: URL.createObjectURL(blob), download: name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const MOD_NAME = {listening:'Listening', reading:'Reading', writing:'Writing'};
const MOD_PILL = {listening:'l', reading:'r', writing:'w'};

/* ---------- языки интерфейса: узбекский, английский, русский ----------
   Каждая строка: [узбекский, английский, русский]. {0}, {1} — подставляемые значения.
   Экран самого экзамена всегда на английском, как на настоящем IELTS. */
const LANGS = ['uz', 'en', 'ru'];
const LANG_NAMES = {uz: 'O‘zbekcha', en: 'English', ru: 'Русский'};
const LOCALES = {uz: 'uz-UZ', en: 'en-GB', ru: 'ru-RU'};
let LANG = 'uz';
const TR = {
  appTitle: ['IELTS kompyuterda — trenajyor', 'Computer-delivered IELTS — trainer', 'IELTS на компьютере — тренажёр'],
  homeH1: ['Kompyuterda IELTS — trenajyor', 'Computer-delivered IELTS — trainer', 'Компьютерный IELTS — тренажёр'],
  homeSub: ['Topshiriqlar PDF faylini va javoblar kalitini yuklang — o‘quvchi haqiqiy imtihondagidek yechadi, tekshiruv darhol',
            'Upload a PDF with the tasks and the answer key — the student takes the test like the real exam and is checked instantly',
            'Загрузите PDF с заданиями и ключ ответов — ученик решает как на настоящем экзамене, проверка сразу'],
  libTitle: ['Testlar kutubxonasi', 'Test library', 'Библиотека тестов'],
  btnImport: ['Testni fayldan yuklash', 'Load test from file', 'Загрузить тест из файла'],
  btnNew: ['+ Yangi test', '+ New test', '+ Новый тест'],
  histTitle: ['Natijalar tarixi', 'Results history', 'История результатов'],
  btnCsv: ['Jadvalni yuklab olish (Excel)', 'Download table (Excel)', 'Скачать таблицу (Excel)'],
  btnClear: ['Tozalash', 'Clear', 'Очистить'],
  howTitle: ['Qanday foydalaniladi', 'How to use', 'Как пользоваться'],
  how1: ['<b>«Yangi test»</b> tugmasini bosing va modulni tanlang (Listening, Reading yoki Writing).',
         'Click <b>“New test”</b> and choose the module (Listening, Reading or Writing).',
         'Нажмите <b>«Новый тест»</b>, выберите модуль (Listening, Reading или Writing).'],
  how2: ['Topshiriqlar PDF faylini yuklang va kerakli test sahifalarini ko‘rsating.',
         'Upload the PDF with the tasks and enter the pages of the test you need.',
         'Загрузите PDF с заданиями и укажите страницы нужного теста.'],
  how3: ['Javoblar PDF faylini yuklang — dastur javoblarni o‘zi topadi. Kalitni tekshiring, kerak bo‘lsa tuzating.',
         'Upload the PDF with the answers — the program finds them itself. Check the key and correct it if needed.',

function tr(key, ...args){
  const row = TR[key];

const DB = {
  db: null, mem: {}, ok: true,
  open(){
    return new Promise(res => {
      let rq;
      try{ rq = indexedDB.open('ielts-cd-trainer', 1); }catch(e){ this.ok = false; return res(); }
      rq.onupgradeneeded = () => rq.result.createObjectStore('tests', {keyPath: 'id'});
      rq.onsuccess = () => { this.db = rq.result; res(); };

    });
  },
  tx(mode){ return this.db.transaction('tests', mode).objectStore('tests'); },
  req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all(){ if(!this.db) return Object.values(this.mem); return this.req(this.tx('readonly').getAll()); },
  async get(id){ if(!this.db) return this.mem[id]; return this.req(this.tx('readonly').get(id)); },
  async put(t){ if(!this.db){ this.mem[t.id] = t; return; } return this.req(this.tx('readwrite').put(t)); },
  async del(id){ if(!this.db){ delete this.mem[id]; return; } return this.req(this.tx('readwrite').delete(id)); }
};

/* =====================================================================
   КЛЮЧ ОТВЕТОВ: разбор текста и проверка ответа ученика
   ===================================================================== */
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

/* «(the) car park» → ["the car park", "car park"] */
function expandOptional(s){
  const m = s.match(/\(([^()]*)\)/);
  if(!m) return [s];
  const pre = s.slice(0, m.index), post = s.slice(m.index + m[0].length);
  // без скобок склеиваем как есть: «travel(l)ing» → «traveling», «(the) park» → « park» (лишний пробел уберётся)
  return [...expandOptional(pre + m[1] + post), ...expandOptional(pre + post)];
}
/* приведение ответа к единому виду для сравнения */
function normAns(s){
  return String(s || '').toLowerCase()
    .replace(/[‘’‛`´]/g, "'").replace(/[“”]/g, '"')
    .replace(/[–—]/g, '-')
    .replace(/(\d),(?=\d{3}(\D|$))/g, '$1')          // 1,000 → 1000
    .replace(/[£$€]/g, '')
    .replace(/\s*-\s*/g, '-')
    .replace(/^[\s.,;:"']+|[\s.,;:!?"']+$/g, '')
    .replace(/\s+/g, ' ').trim();
}
/* варианты одного ответа: «/» или « OR » разделяют варианты */
function answerAlts(raw){
  const parts = String(raw).split(/\s*\/\s*|\s+OR\s+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  parts.forEach(p => expandOptional(p).forEach(v => { const n = normAns(v); if(n && !out.includes(n)) out.push(n); }));
  return out;
}
const TFNG = ['TRUE', 'FALSE', 'NOT GIVEN'], YNNG = ['YES', 'NO', 'NOT GIVEN'];

/* Разбор ключа. Возвращает {byQ:{n:{q,raw,alts,group,range}}, groups:[{qs,items,raw}], bad:[строки]} */
function parseKey(text){
  const res = {byQ: {}, groups: [], bad: [], dup: []};
  String(text || '').split(/\r?\n/).forEach(line0 => {
    let line = line0.replace(/[ \t]/g, ' ').replace(/\s+/g, ' ').trim();
    if(!line || line.startsWith('#')) return;
    let range = null;
    const rm = line.match(/\[\s*([A-Za-z])\s*[-–]\s*([A-Za-z])\s*\]\s*$/);
    if(rm){ range = [rm[1].toUpperCase(), rm[2].toUpperCase()]; line = line.slice(0, rm.index).trim(); }
    // группа «14-15 B, D» / «21&22 A C» — порядок любой
    let m = line.match(/^(\d{1,3})\s*(?:-|–|—|&|and|,)\s*(\d{1,3})[.):]?\s+(.+)$/i);
    if(m && +m[2] > +m[1] && +m[2] - +m[1] <= 4){
      const a = +m[1], b = +m[2];
      let body = m[3].replace(/\(?\s*(?:in\s+)?(?:any|either)\s+order\s*\)?/ig, ' ')
                     .replace(/\bboth\b|\bin\s+any\b/ig, ' ').replace(/\s+/g, ' ').trim();
      let items;
      if(/^[A-Za-z](?:\s*[,;/&]?\s*(?:and\s+)?[A-Za-z])+$/.test(body) && !/[a-z]{2}/i.test(body.replace(/\band\b/ig, '')))
        items = body.replace(/\band\b/ig, ' ').split(/[\s,;/&]+/).filter(Boolean).map(x => x.toUpperCase());
      else items = body.split(/\s*[,;]\s*|\s+and\s+/i).filter(Boolean);
      const qs = []; for(let q = a; q <= b; q++) qs.push(q);
      if(items.length < qs.length){ res.bad.push(line0.trim() + tr('lessAnswers')); return; }
      const g = {qs, items: items.map(it => ({raw: it, alts: answerAlts(it)})), raw: items.join(', ')};
      res.groups.push(g);
      qs.forEach(q => {
        if(res.byQ[q]) res.dup.push(q);
        res.byQ[q] = {q, raw: g.raw, alts: [], group: g, range};
      });
      return;
    }
    m = line.match(/^(\d{1,3})[.):]?\s+(.+)$/);
    if(m && +m[1] >= 1){
      const q = +m[1];
      let raw = m[2].trim().replace(/^NG$/i, 'NOT GIVEN');
      if(res.byQ[q]) res.dup.push(q);
      res.byQ[q] = {q, raw, alts: answerAlts(raw), group: null, range};
      return;
    }
    res.bad.push(line0.trim());
  });
  return res;
}

/* Вид каждого вопроса: tf / yn / letter / text. Буквы и TF ищутся «блоками» подряд идущих вопросов. */
function buildQuestions(total, key, partSizes){
  const Q = [];
  for(let n = 1; n <= total; n++) Q.push({n, kind: 'text', options: null, key: key ? key.byQ[n] || null : null});
  if(key){
    const firstAlt = e => e ? (e.group ? e.group.items.map(i => i.raw.trim()) : [e.raw.split(/\s*\/\s*|\s+OR\s+/)[0].trim()]) : [];
    const kindOf = e => {
      if(!e) return null;
      const f = firstAlt(e);
      if(f.every(x => /^[A-Z]$/.test(x))) return 'letter';
      const u = f.map(x => x.toUpperCase());
      if(u.every(x => x === 'NOT GIVEN')) return 'ng';
      if(u.every(x => x === 'TRUE' || x === 'FALSE')) return 'tf';
      if(u.every(x => x === 'YES' || x === 'NO')) return 'yn';
      return 'text';
    };
    const kinds = Q.map(q => kindOf(q.key));
    // блоки TRUE/FALSE/NOT GIVEN или YES/NO/NOT GIVEN
    let i = 0;
    while(i < Q.length){
      if(['tf','yn','ng'].includes(kinds[i])){
        let j = i; while(j < Q.length && ['tf','yn','ng'].includes(kinds[j])) j++;
        const isYN = kinds.slice(i, j).includes('yn');
        for(let k = i; k < j; k++){ Q[k].kind = isYN ? 'yn' : 'tf'; Q[k].options = isYN ? YNNG : TFNG; }
        i = j;
      } else if(kinds[i] === 'letter'){
        let j = i; while(j < Q.length && kinds[j] === 'letter') j++;
        let maxL = 'C', minL = 'A', declared = null;
        for(let k = i; k < j; k++){
          firstAlt(Q[k].key).forEach(x => { if(x > maxL) maxL = x; });
          (Q[k].key.alts || []).forEach(a => { const A = a.toUpperCase(); if(/^[A-Z]$/.test(A) && A > maxL) maxL = A; });
          if(Q[k].key.range) declared = Q[k].key.range;
        }
        if(declared){ minL = declared[0]; maxL = declared[1]; }
        const opts = LETTERS.slice(LETTERS.indexOf(minL), LETTERS.indexOf(maxL) + 1).split('');
        for(let k = i; k < j; k++){ Q[k].kind = 'letter'; Q[k].options = opts; }
        i = j;
      } else i++;
    }
  }
  // распределение по частям
  let p = 0, left = partSizes[0] || total;
  Q.forEach(q => {
    while(left <= 0 && p < partSizes.length - 1){ p++; left = partSizes[p]; }
    q.part = p; left--;
  });
  return Q;
}

/* Проверка всех ответов: → {n: 'ok'|'bad'|'empty'|'nokey'} */
function checkAll(Q, answers){
  const res = {};
  const doneGroups = new Set();
  Q.forEach(q => {
    const k = q.key;
    if(!k){ res[q.n] = 'nokey'; return; }
    if(k.group){
      const g = k.group;
      if(doneGroups.has(g)) return;
      doneGroups.add(g);
      const used = new Set();
      g.qs.forEach(n => {
        const a = normAns(answers[n]);
        if(!a){ res[n] = 'empty'; return; }
        const idx = g.items.findIndex((it, i) => !used.has(i) && it.alts.includes(a));
        if(idx >= 0){ used.add(idx); res[n] = 'ok'; } else res[n] = 'bad';
      });
      return;
    }
    const a = normAns(answers[q.n]);
    if(!a){ res[q.n] = 'empty'; return; }
    res[q.n] = k.alts.includes(a) ? 'ok' : 'bad';
  });
  return res;
}

function toBand(table, score, total){
  const s = total === 40 ? score : Math.round(score * 40 / Math.max(1, total));
  for(const [min, b] of BANDS[table]) if(s >= min) return b;
  return 0;
}

/* Текст страниц → «строки». Большие промежутки по горизонтали делят строку на колонки. */
async function pdfChunks(doc, from, to){
  const chunks = [];
  for(let p = from; p <= to; p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({
      s: it.str, x: it.transform[4], y: it.transform[5], w: it.width,
      fh: Math.abs(it.transform[3]) || Math.abs(it.transform[0]) || 10
    }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    items.forEach(it => {
      const L = lines.find(l => Math.abs(l.y - it.y) < Math.max(2, it.fh * 0.45));
      if(L) L.items.push(it); else lines.push({y: it.y, items: [it]});
    });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(L => {
      L.items.sort((a, b) => a.x - b.x);
      let cur = '', lastEnd = null, fh = 10;
      L.items.forEach(it => {
        fh = it.fh;
        if(lastEnd != null){
          const gap = it.x - lastEnd;
          if(gap > fh * 2.2){ if(cur.trim()) chunks.push(cur.trim()); cur = ''; }
          else if(gap > fh * 0.12 && !/\s$/.test(cur) && !/^\s/.test(it.s)) cur += ' ';
        }
        cur += it.s; lastEnd = it.x + it.w;
      });
      if(cur.trim()) chunks.push(cur.trim());
    });
  }
  return chunks;
}

/* Поиск пар «номер — ответ» в строках PDF. Возвращает текст ключа и замечания. */
function chunksToKey(chunks){
  const found = new Map(), dup = new Set();
  const put = (q, ans) => {
    ans = ans.replace(/\s+/g, ' ').trim();
    if(!ans) return;
    if(found.has(q)){ dup.add(q); return; }
    found.set(q, ans);
  };
  chunks.forEach(ch0 => {
    let ch = ch0.replace(/[–—]/g, '-')
      .replace(/^(\d{1,2})\s*(?:&|and|-|,)\s*(\d{1,2})(?=[\s.)])/i, (m, a, b) => (+b > +a && +b - +a <= 4) ? a + '-' + b : m);
    const toks = ch.split(' ');
    let curQ = null, curTok = [], last = 0;
    const flush = () => { if(curQ != null) put(curQ, curTok.join(' ')); curQ = null; curTok = []; };
    toks.forEach((t, i) => {
      const g = t.match(/^(\d{1,2})-(\d{1,2})[.):]?$/);
      const s = t.match(/^(\d{1,2})[.):]?$/);
      if(i === 0 && g && +g[1] >= 1 && +g[2] > +g[1] && +g[2] - +g[1] <= 4){ flush(); curQ = g[1] + '-' + g[2]; last = +g[2]; return; }
      if(s){
        const n = +s[1];
        const isMarker = (i === 0 && n >= 1 && n <= 60) || (curQ != null && curTok.length > 0 && (n === last + 1));
        if(isMarker){ flush(); curQ = n; last = n; return; }
      }
      if(curQ != null) curTok.push(t);
    });
    flush();
  });
  const nums = [...found.keys()].sort((a, b) => parseInt(a) - parseInt(b));
  const text = nums.map(q => q + ' ' + found.get(q)).join('\n');
  // «21-22» — это два вопроса
  const count = nums.reduce((c, q) => { const m = String(q).match(/^(\d+)-(\d+)$/); return c + (m ? +m[2] - +m[1] + 1 : 1); }, 0);
  return {text, count, dup: [...dup]};
}

/* Просмотрщик PDF: страницы рисуются по мере прокрутки, есть масштаб и маркер */
class PdfView{

    this.root = h('div', {class: 'pdfview'});
    this.bar = h('div', {class: 'pdfbar'});

    this.scale = 'fit'; this.pages = []; this.gen = 0;
    this.hl = this.opts.highlights || null;   // {pageNum:[{x,y,w,h}]} в долях страницы
    const lab = this.opts.ui ? {fit: tr('fit'), page: tr('pageAbbr')} : {fit:'Fit', page:'Page'};
    this.lab = lab;
    this.zoomLab = h('span', null, '');
    this.pageLab = h('span', null, '');
    this.bar.append(
      h('button', {title: 'Zoom out', onclick: () => this.zoom(1 / 1.15)}, '−'),
      this.zoomLab,
      h('button', {title: 'Zoom in', onclick: () => this.zoom(1.15)}, '+'),
      h('button', {onclick: () => { this.scale = 'fit'; this.layout(); }}, lab.fit),
      h('span', {class: 'sp'}), this.pageLab);
    if(this.opts.extraBar) this.bar.append(this.opts.extraBar);
    this.io = new IntersectionObserver(ents => ents.forEach(en => {
      if(en.isIntersecting){ const pg = this.pages.find(p => p.div === en.target); if(pg) this.render(pg); }
    }), {root: this.scroller, rootMargin: '900px 0px'});
    this.scroller.addEventListener('scroll', () => this.updPageLab());
    this.ro = new ResizeObserver(() => { if(this.scale === 'fit') { clearTimeout(this.rt); this.rt = setTimeout(() => this.layout(), 150); } });
    this.ro.observe(this.scroller);
  }
  async open(doc, from, to){
    this.doc = doc;
    from = Math.max(1, Math.min(doc.numPages, from || 1));
    to = Math.max(from, Math.min(doc.numPages, to || doc.numPages));
    this.from = from;
    for(let p = from; p <= to; p++){
      const page = await doc.getPage(p);
      const vp = page.getViewport({scale: 1});
      const div = h('div', {class: 'pdfpage', 'data-p': p});
      const pg = {num: p, page, w: vp.width, h: vp.height, div, done: -1};
      div.append(h('div', {class: 'hlayer'}));
      this.pages.push(pg); this.scroller.append(div);
    }
    this.layout();
  }
  curScale(){
    if(this.scale !== 'fit') return this.scale;
    const maxW = Math.max(...this.pages.map(p => p.w), 1);
    return Math.max(0.3, (this.scroller.clientWidth - 30) / maxW);
  }
  layout(){
    if(!this.pages.length) return;
    const top = this.topPage(), s = this.curScale();
    this.gen++; this.s = s;
    this.zoomLab.textContent = Math.round(s * 100) + '%';
    this.pages.forEach(pg => {
      pg.div.style.width = Math.floor(pg.w * s) + 'px';
      pg.div.style.height = Math.floor(pg.h * s) + 'px';
      this.io.unobserve(pg.div); this.io.observe(pg.div);
    });
    if(top) this.scrollToPage(top, true);
    this.updPageLab();
  }
  zoom(f){ this.scale = Math.min(4, Math.max(0.3, this.curScale() * f)); this.layout(); }
  async render(pg){
    const gen = this.gen;
    if(pg.done === gen || pg.busy === gen) return;
    pg.busy = gen;
    const s = this.s, vp = pg.page.getViewport({scale: s});
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const canvas = h('canvas');
    canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
    canvas.style.width = Math.floor(vp.width) + 'px'; canvas.style.height = Math.floor(vp.height) + 'px';
    try{
      await pg.page.render({canvasContext: canvas.getContext('2d'), viewport: vp,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null}).promise;
    }catch(e){ pg.busy = -1; return; }
    if(gen !== this.gen) return;
    pg.div.querySelectorAll('canvas,.textLayer,.pno').forEach(e => e.remove());
    pg.div.prepend(canvas);
    if(this.opts.showNums) pg.div.append(h('div', {class: 'pno'}, (this.opts.ui ? tr('pageAbbr') + ' ' : '') + pg.num));
    try{
      const tc = await pg.page.getTextContent();
      if(gen !== this.gen) return;
      const tl = h('div', {class: 'textLayer'});
      tl.style.setProperty('--scale-factor', s);
      pg.div.append(tl);
      await pdfjsLib.renderTextLayer({textContentSource: tc, container: tl, viewport: vp, textDivs: []}).promise;
      const eoc = h('div', {class: 'endOfContent'}); tl.append(eoc);
      tl.addEventListener('mousedown', () => tl.classList.add('selecting'));
    }catch(e){}
    pg.done = gen;
    this.drawHl(pg);
  }
  drawHl(pg){
    const L = pg.div.querySelector('.hlayer'); L.innerHTML = '';
    ((this.hl && this.hl[pg.num]) || []).forEach(r => L.append(h('div', {style:
      `left:${r.x * 100}%;top:${r.y * 100}%;width:${r.w * 100}%;height:${r.h * 100}%`})));
  }
  topPage(){
    const st = this.scroller.scrollTop + 20;
    let best = null;
    this.pages.forEach(pg => { if(pg.div.offsetTop <= st) best = pg.num; });
    return best;
  }
  updPageLab(){
    const t = this.topPage() || this.from;
    this.pageLab.textContent = this.lab.page + ' ' + t + ' / ' + (this.pages.length ? this.pages[this.pages.length - 1].num : '');
  }
  scrollToPage(num, instant){
    const pg = this.pages.find(p => p.num === num);
    if(pg) this.scroller.scrollTo({top: pg.div.offsetTop - 12, behavior: instant ? 'auto' : 'smooth'});
  }
  /* выделенный мышью текст → прямоугольники по страницам */
  selectionRects(){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    if(!this.scroller.contains(range.commonAncestorContainer)) return null;
    const out = {};
    const walker = document.createTreeWalker(range.commonAncestorContainer.nodeType === 3 ?
      range.commonAncestorContainer.parentNode : range.commonAncestorContainer, NodeFilter.SHOW_TEXT);
    let node;
    while((node = walker.nextNode())){
      if(!range.intersectsNode(node) || !node.parentElement.closest('.textLayer')) continue;
      const r = document.createRange();
      r.selectNodeContents(node);
      if(node === range.startContainer) r.setStart(node, range.startOffset);
      if(node === range.endContainer) r.setEnd(node, range.endOffset);
      const pageDiv = node.parentElement.closest('.pdfpage');
      const pb = pageDiv.getBoundingClientRect();
      Array.from(r.getClientRects()).forEach(cr => {
        if(cr.width < 1 || cr.height < 1) return;
        const num = +pageDiv.dataset.p;
        (out[num] = out[num] || []).push({x: (cr.left - pb.left) / pb.width, y: (cr.top - pb.top) / pb.height,
          w: cr.width / pb.width, h: cr.height / pb.height});
      });
    }
    return Object.keys(out).length ? out : null;
  }
  addHl(rects){
    for(const p in rects){ this.hl[p] = (this.hl[p] || []).concat(rects[p]); }
    this.redrawAll();
  }
  clearHl(rects){
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    for(const p in rects) if(this.hl[p]) this.hl[p] = this.hl[p].filter(r => !rects[p].some(s => hit(r, s)));
    this.redrawAll();
  }
  hlAt(clientX, clientY){
    for(const pg of this.pages){
      const b = pg.div.getBoundingClientRect();
      if(clientX < b.left || clientX > b.right || clientY < b.top || clientY > b.bottom) continue;
      const x = (clientX - b.left) / b.width, y = (clientY - b.top) / b.height;
      const r = (this.hl[pg.num] || []).find(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
      if(r) return {[pg.num]: [{x: r.x, y: r.y, w: r.w, h: r.h}]};
    }
    return null;
  }
  redrawAll(){ this.pages.forEach(pg => this.drawHl(pg)); }
  destroy(){ this.io.disconnect(); this.ro.disconnect(); this.host.innerHTML = ''; }
}

function edKeyPreview(){
  const box = $('#edKeyPrev'); box.innerHTML = '';
  if(ED.module === 'writing') return;
  const key = parseKey($('#edKey').value);
  const sizes = partSizesOf({module: ED.module, parts: $('#edParts').value});
  const total = sizes.reduce((a, b) => a + b, 0);
  const maxQ = Math.max(0, ...Object.keys(key.byQ).map(Number));
  const Q = buildQuestions(Math.max(total, maxQ), key, sizes);
  const KIND = {tf: 'TRUE / FALSE / NG', yn: 'YES / NO / NG', letter: tr('kindLetter'), text: tr('kindText')};
  const tb = h('table', {class: 't'});
  tb.append(h('tr', null, h('th', null, '№'), h('th', null, tr('thAnswer')), h('th', null, tr('thSees'))));
  Q.forEach(q => {
    const k = q.key;
    tb.append(h('tr', null, h('td', null, q.n),
      h('td', null, k ? (k.group ? k.raw + tr('anyOrder') : k.raw) : h('span', {class: 'miss'}, tr('noAnswer'))),
      h('td', null, h('span', {class: 'kind'}, KIND[q.kind] + (q.kind === 'letter' ? ' ' + q.options[0] + '–' + q.options[q.options.length - 1] : '')))));
  });
  box.append(tb);
  const msgs = [];
  const missing = Q.filter(q => !q.key).map(q => q.n);
  if(missing.length && Object.keys(key.byQ).length) msgs.push(tr('msgMissing', missing.join(', ')));
  if(maxQ > total && total) msgs.push(tr('msgOver', maxQ, total));
  if(key.dup.length) msgs.push(tr('msgDup', [...new Set(key.dup)].join(', ')));
  if(key.bad.length) msgs.push(tr('msgBad', key.bad.join(' | ')));
  if(msgs.length) box.prepend(h('div', {class: 'note', style: 'margin:6px', html: msgs.map(esc).join('<br>')}));
}

async function edExtract(){
  if(!ED.answersPdf) return toast(tr('pickAnsPdf'));
  const msg = $('#edExtractMsg');
  msg.innerHTML = '<div class="sub">' + tr('searching') + '</div>';
  try{
    const doc = await openPdf(ED.answersPdf.data);
    const from = Math.max(1, +$('#edAFrom').value || 1);
    const to = Math.min(doc.numPages, +$('#edATo').value || doc.numPages);
    const chunks = await pdfChunks(doc, from, to);
    if(!chunks.length){
      msg.innerHTML = '<div class="errmsg">' + tr('scanned') + '</div>';
      return;
    }
    const r = chunksToKey(chunks);
    if(!r.count){ msg.innerHTML = '<div class="errmsg">' + tr('notFound', from, to) + '</div>'; return; }
    if($('#edKey').value.trim() && !(await confirmBox(tr('replaceKeyQ'), tr('replaceKeyText'), tr('replace')))){ msg.innerHTML = ''; return; }
    $('#edKey').value = r.text;
    let html = '<div class="okmsg">' + tr('foundN', r.count, from, to) + '</div>';
    if(r.dup.length) html += '<div class="note" style="margin-top:6px">' + tr('foundDup', r.dup.slice(0, 12).join(', ')) + '</div>';
    msg.innerHTML = html;
    edKeyPreview();
  }catch(e){ msg.innerHTML = '<div class="errmsg">' + tr('pdfReadErr', esc(e.message)) + '</div>'; }
}

function readFileBuf(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(f); }); }

async function edSave(){
  ED.title = $('#edName').value.trim();
  ED.minutes = Math.max(1, +$('#edMin').value || DEFAULTS[ED.module].minutes);
  ED.parts = $('#edParts').value.trim() || DEFAULTS[ED.module].parts;
  ED.partPages = $('#edPartPages').value.trim();
  ED.from = Math.max(1, +$('#edFrom').value || 1);
  ED.to = +$('#edTo').value || null;
  ED.aFrom = Math.max(1, +$('#edAFrom').value || 1);
  ED.aTo = +$('#edATo').value || null;
  ED.keyText = $('#edKey').value;
  if(!ED.tasksPdf) return toast(tr('uploadTasks'));
  if(!ED.title) ED.title = ED.tasksPdf.name.replace(/\.pdf$/i, '') + ' — ' + MOD_NAME[ED.module];
  if(ED.module !== 'writing'){
    const key = parseKey(ED.keyText);
    const total = partSizesOf(ED).reduce((a, b) => a + b, 0);
    const maxQ = Math.max(0, ...Object.keys(key.byQ).map(Number));
    if(maxQ > total) return toast(tr('keyOverToast', maxQ, total), 4000);
    if(!Object.keys(key.byQ).length &&
       !(await confirmBox(tr('noKeyQ'), tr('noKeyText'), tr('save'))))
      return;
  }
  if(!ED.id){ ED.id = uid(); ED.created = Date.now(); }
  ED.updated = Date.now();
  try{ await DB.put(ED); }catch(e){ return modal(tr('saveFail'), '<p>' + esc(e.message) + '</p><p>' + tr('diskFull') + '</p>'); }
  toast(tr('saved'));
  renderHome();
}

let INTRO = null;
async function openIntro(id){
  const t = await DB.get(id);
  if(!t) return;
  INTRO = {t, mode: LS.get('ielts_mode', 'strict')};
  $('#inName').value = LS.get('ielts_lastname', '');

  showScreen('intro');

function fillIntro(){
  const t = INTRO.t;
  $('#inTitle').textContent = t.title;
  const rt = runtimeFor(t);
  const info = [MOD_NAME[t.module]];
  if(t.module === 'writing') info.push(tr('introW'), tr('nMin', t.minutes));
  else {
    info.push(tr('nQ', rt.Q.length));
    if(t.module === 'listening' && (t.audio || []).length) info.push(tr('introAudio', t.audio.length));
    else info.push(tr('nMin', t.minutes));
  }
  $('#inInfo').textContent = info.join(' · ');
  $('#inSound').classList.toggle('hidden', t.module !== 'listening');
  syncIntroMode();
}
function syncIntroMode(){

  const L = INTRO.t.module === 'listening';

function beep(vol){
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 660; g.gain.value = 0.2 * (vol == null ? 1 : vol); o.connect(g); g.connect(ac.destination);
    o.start(); setTimeout(() => { o.stop(); ac.close(); }, 900);
  }catch(e){}
}

function runtimeFor(test){
  const isW = test.module === 'writing';
  const key = isW ? null : parseKey(test.keyText);
  const hasKey = !!key && Object.keys(key.byQ).length > 0;
  const sizes = partSizesOf(test);
  const total = sizes.reduce((a, b) => a + b, 0);
  const maxQ = hasKey ? Math.max(...Object.keys(key.byQ).map(Number)) : 0;
  const Q = isW ? [] : buildQuestions(Math.max(total, maxQ), hasKey ? key : null, sizes);
  const nParts = isW ? 2 : Math.max(1, sizes.length);
  const partPages = String(test.partPages || '').split(/[,;\s]+/).map(Number).filter(n => n > 0);
  if(isW && partPages.length === 1) partPages.unshift(test.from || 1);
  const paper = !isW && Array.isArray(test.paper) && test.paper.length ? test.paper : null;   // задание прямо на экране
  return {test, isW, key, hasKey, Q, nParts, partPages, paper,
    hasAudio: test.module === 'listening' && (test.audio || []).length > 0};
}

function xDialog(title, body, buttons, opts){

  let head, time, ins, inf;

      'For each part of the test there will be time for you to look through the questions and time for you to check your answers.'];
  } else if(T.isW){

    ins = ['Answer <b>both</b> parts.', 'You can change your answers at any time during the test.'];
    inf = ['There are two parts in this test.', 'Part 2 contributes twice as much as Part 1 to the writing score.',
      'The test clock will show you when there are 10 minutes and 5 minutes remaining.'];

    head = 'IELTS ' + (t.readingType === 'general' ? 'General Training' : 'Academic') + ' Reading'; time = t.minutes + ' minutes';

    inf = ['There are ' + n + ' questions in this test.', 'Each question carries one mark.', partsTxt,

      h('h3', null, 'INFORMATION FOR CANDIDATES'), h('ul', null, inf.map(x => h('li', {html: x}))),

/* общая длина всех записей теста (для строки «Approximately … minutes») */
function audioTotal(){
  return Promise.all((T.test.audio || []).map(a => new Promise(res => {
    const u = URL.createObjectURL(a.blob), el = new Audio(); el.preload = 'metadata';
    const fin = v => { URL.revokeObjectURL(u); res(v); };
    el.onloadedmetadata = () => fin(el.duration || 0); el.onerror = () => fin(0); el.src = u;
    setTimeout(() => fin(0), 4000);
  }))).then(a => a.reduce((s, x) => s + x, 0));
}

/* ---------- таймер ---------- */
function onTick(){
  if(!X || X.finished || X.review) return;
  const now = Date.now(), dt = Math.min(5000, now - (X.lastTick || now)); X.lastTick = now;
  const au = $('#xAudio');
  if(au && T.hasAudio){ X.audioTime = au.currentTime || 0; }
  let html = '', red = false;
  if(X.mode === 'practice'){
    X.elapsed += dt;
    html = '<span class="big">' + fmtClock(X.elapsed / 1000) + '</span> time used';
  } else if(T.hasAudio){
    X.elapsed += dt;
    if(X.phase === 'main'){
      let rest = 0, known = true;
      for(let i = X.audioIdx; i < audioURLs.length; i++){
        if(audioDur[i] == null) { known = false; break; }
        rest += i === X.audioIdx ? audioDur[i] - (au.currentTime || 0) : audioDur[i];
      }
      html = known ? timerHTML(rest + 120) : 'Listening…';
    } else {
      X.checkLeft -= dt; red = true;
      html = '<span class="big">' + fmtClock(X.checkLeft / 1000) + '</span> to check your answers';
      if(X.checkLeft <= 0) return autoSubmit();
    }
  } else {
    X.remaining -= dt; X.elapsed += dt;
    const sec = X.remaining / 1000;
    html = timerHTML(sec); red = sec < 300;
    [10, 5].forEach(m => { if(sec <= m * 60 && sec > m * 60 - 30 && !X.alerts[m]){
      X.alerts[m] = 1; xAlert(m + ' minutes remaining');
      const b = $('#xTimerBox'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 5000);
    } });
    if(X.remaining <= 0) return autoSubmit();
  }
  const el = $('#xTimer');
  el.innerHTML = X.timerHidden ? 'Click to show the time' : html;
  $('#xTimerBox').classList.toggle('red', red && !X.timerHidden);
  if(!X.saveAt || now - X.saveAt > 2000){ X.saveAt = now; saveAttempt(); }
}
function timerHTML(sec){
  if(sec < 60) return '<span class="big">' + Math.max(0, Math.ceil(sec)) + '</span> seconds left';
  const m = Math.ceil(sec / 60);
  return '<span class="big">' + m + '</span> ' + (m === 1 ? 'minute left' : 'minutes left');
}

/* ---------- полоса заголовка и правая панель ---------- */
let shownPart = -1;
const curPart = () => T.isW ? X.task - 1 : (T.Q[X.cur - 1] ? T.Q[X.cur - 1].part : 0);

function renderTitle(p){
  const tl = $('#xTitle'); tl.innerHTML = '';

    const k = p + 1;
    tl.append(h('span', null, 'Part ' + k), h('span', {class: 'sub'}, (k === 1 ? 'You should spend about 20 minutes on this task.' :
      'You should spend about 40 minutes on this task.') + ' Write at least ' + (k === 1 ? 150 : 250) + ' words.'));

  }

function renderRight(force){
  const p = curPart();
  if(!force && p === shownPart) return;
  const prev = shownPart; shownPart = p;
  renderTitle(p);
  const R = $('#xRight'); R.innerHTML = ''; R.scrollTop = 0;
  if(T.isW) renderWritingTask(R);
  else if(T.paper) renderPaper(R, p);
  else {

      R.append(h('div', {class: 'lhead'}, h('h4', null, 'Questions ' + qs[0].n + ' – ' + qs[qs.length - 1].n),
        h('div', null, 'Read the questions in the text on the left. Write or choose your answers below.')));

    }
  }

/* поле для ответа: номер вопроса виден внутри, как на экзамене */
function gapInput(n){
  const rv = X.review ? X.res[n] : null;
  const inp = h('input', {class: 'gap' + (rv === 'ok' ? ' ok' : rv === 'bad' || rv === 'empty' ? ' bad' : ''), 'data-qs': n,
    placeholder: n, value: X.answers[n] || '', disabled: X.review || null, spellcheck: 'false', autocomplete: 'off',
    autocorrect: 'off', autocapitalize: 'off', maxlength: 60,
    oninput: e => { setAnswer(n, e.target.value); fitGap(e.target); }, onfocus: () => { if(X.cur !== n) goQ(n, false); }});
  fitGap(inp);
  if(!X.review) return inp;
  const f = document.createDocumentFragment(); f.append(inp, reviewMark(n)); return f;
}
/* поле растягивается под длинный ответ (например, номер карты) */
function fitGap(inp){ inp.style.width = Math.max(117, Math.round(inp.value.length * 7.8 + 18)) + 'px'; }
/* в разборе: рядом с ответом — верно / неверно и правильный ответ */
function reviewMark(n){
  const r = X.res[n], k = T.Q[n - 1] && T.Q[n - 1].key;
  if(r === 'ok') return h('span', {class: 'mark ok'}, '✓');
  if(r === 'nokey' || !k) return h('span', {class: 'mark'}, '');
  return h('span', {class: 'mark bad'}, '✗ ', h('span', {class: 'ca'}, k.group ? k.raw + ' (any order)' : k.raw));
}
/* переключатель: повторный щелчок по выбранному ответу снимает выбор (как на экзамене) */
function radioToggle(lab, inp, n, val){
  lab.addEventListener('mousedown', () => { inp._was = inp.checked; });
  inp.addEventListener('click', () => {
    if(inp._was){ inp.checked = false; setAnswer(n, ''); } else setAnswer(n, val);
    inp._was = false; goQ(n, false);
  });
}

function renderQ(q){
  const ans = X.answers[q.n] || '', rv = X.review ? X.res[q.n] : null;
  const row = h('div', {class: 'lq' + (X.cur === q.n ? ' cur' : ''), 'data-qs': q.n, onclick: () => { if(X.cur !== q.n) goQ(q.n, false); }});
  row.append(h('b', {class: 'ln'}, q.n));
  if(q.options){
    const box = h('div', {class: 'lopts'});
    q.options.forEach(o => {
      const inp = h('input', {type: 'radio', name: 'lq' + q.n, value: o, checked: ans === o || null, disabled: X.review || null});
      const corr = rv && q.key && (q.key.group ? q.key.group.items.some(i => i.raw.trim().toUpperCase() === o) : q.key.alts.includes(normAns(o)));
      const lab = h('label', {class: X.review ? (corr ? 'okopt' : ans === o ? 'badopt' : '') : ''}, inp, o);
      if(!X.review) radioToggle(lab, inp, q.n, o);
      box.append(lab);
    });
    row.append(box);
    if(X.review) row.append(reviewMark(q.n));
  } else row.append(gapInput(q.n));
  return row;
}

/* ---------- задание прямо на экране: блоки из теста (test.paper) ---------- */
function renderPaper(R, p){
  const wrap = h('div', {class: 'paper'});

  R.append(wrap);

function fillGaps(html){
  const div = h('div', {class: 'pbody', html: html.replace(/\{\{(\d+)(:drag)?\}\}/g,
    (m, n, d) => '<span class="gapslot" data-n="' + n + '" data-drag="' + (d ? 1 : '') + '"></span>')});
  div.querySelectorAll('.gapslot').forEach(s => s.replaceWith(s.dataset.drag ? dropGap(+s.dataset.n) : gapInput(+s.dataset.n)));
  return div;
}
function renderBlock(b){
  if(b.t === 'h') return h('div', {class: 'phead'}, h('h4', null, b.q), b.i ? h('div', {class: 'pinstr', html: b.i}) : null);
  if(b.t === 'html') return fillGaps(b.html);
  if(b.t === 'mc') return mcBlock(b);
  if(b.t === 'multi') return multiBlock(b);
  if(b.t === 'drag') return dragBlock(b);
  if(b.t === 'grid') return gridBlock(b);
  return null;
}
function mcBlock(b){
  const box = h('div', {class: 'mcq' + (b.wide ? ' wide' : '') + (X.cur === b.n ? ' cur' : ''), 'data-qs': b.n,
    onclick: () => { if(X.cur !== b.n) goQ(b.n, false); }});
  box.append(h('div', {class: 'qt'}, h('b', null, b.n), h('span', {html: b.q})));
  const key = T.Q[b.n - 1] && T.Q[b.n - 1].key, ans = X.answers[b.n] || '';
  b.o.forEach((txt, i) => {
    const L = LETTERS[i];
    const inp = h('input', {type: 'radio', name: 'mc' + b.n, value: L, checked: ans === L || null, disabled: X.review || null});
    const corr = X.review && key && key.alts.includes(normAns(L));
    const lab = h('label', {class: X.review ? (corr ? 'okopt' : ans === L ? 'badopt' : '') : ''}, inp, h('span', {html: txt}));
    if(!X.review) radioToggle(lab, inp, b.n, L);
    box.append(lab);
  });
  if(X.review) box.append(reviewMark(b.n));
  return box;
}
function multiBlock(b){
  const ns = b.n;
  const box = h('div', {class: 'mcq wide' + (ns.includes(X.cur) ? ' cur' : ''), 'data-qs': ns.join(' '),
    onclick: () => { if(!ns.includes(X.cur)) goQ(ns[0], false); }});
  box.append(h('div', {class: 'qt'}, h('b', null, ns[0] + ' – ' + ns[ns.length - 1]), h('span', {html: b.q})));
  const chosen = () => ns.map(n => X.answers[n]).filter(Boolean);
  const key = T.Q[ns[0] - 1] && T.Q[ns[0] - 1].key;
  const good = key && key.group ? key.group.items.map(i => i.raw.trim().toUpperCase()) : [];
  b.o.forEach((txt, i) => {
    const L = LETTERS[i], on = chosen().includes(L);
    const cb = h('input', {type: 'checkbox', value: L, checked: on || null, disabled: X.review || null});
    cb.addEventListener('change', () => {
      let s = chosen();
      if(cb.checked){ if(s.length >= ns.length){ cb.checked = false; return; } s.push(L); } else s = s.filter(x => x !== L);
      s.sort(); ns.forEach((n, j) => { X.answers[n] = s[j] || ''; });
      renderNav(); saveAttempt();
    });
    box.append(h('label', {class: X.review ? (good.includes(L) ? 'okopt' : on ? 'badopt' : '') : ''}, cb, h('span', {html: txt})));
  });
  if(X.review) ns.forEach(n => box.append(h('span', null, h('b', null, n + ': '), reviewMark(n))));
  return box;
}
/* сопоставление: в каждой строке одна буква, повторный щелчок снимает выбор */
function gridBlock(b){
  const t = h('table', {class: 'pgrid'});
  t.append(h('tr', null, h('th', null, ''), ...b.cols.map(c => h('th', null, c))));
  b.n.forEach((n, i) => {
    const ans = X.answers[n] || '', key = T.Q[n - 1] && T.Q[n - 1].key;
    const tr = h('tr', {class: X.cur === n ? 'cur' : '', 'data-qs': n});
    const first = h('td', {class: 'rq'}, h('b', null, n), h('span', {html: b.rows[i]}));
    if(X.review) first.append(reviewMark(n));
    tr.append(first);
    b.cols.forEach(c => {
      const corr = X.review && key && key.alts.includes(normAns(c));
      const td = h('td', {class: 'cell' + (X.review ? (corr ? ' ok' : ans === c ? ' bad' : '') : '')},
        h('input', {type: 'radio', name: 'g' + n, checked: ans === c || null, disabled: X.review || null, tabindex: -1}));
      if(!X.review) td.addEventListener('click', () => { setAnswer(n, X.answers[n] === c ? '' : c); renderRight(true); goQ(n, false); });
      tr.append(td);
    });
    t.append(tr);
  });
  return h('div', null, b.legend ? h('div', {class: 'pbody', html: b.legend}) : null, t);
}
/* перетаскивание: варианты справа, их переносят в пропуски слева (можно и щелчком) */
let dragSel = null;
function dropGap(n){
  const v = X.answers[n] || '', rv = X.review ? X.res[n] : null;
  const g = h('span', {class: 'gap' + (v ? '' : ' empty') + (rv === 'ok' ? ' ok' : rv === 'bad' || rv === 'empty' ? ' bad' : ''), 'data-qs': n,
    title: X.review ? '' : (v ? 'Click to remove the answer' : 'Drag an answer here')}, v || String(n));
  if(!X.review){
    g.addEventListener('dragover', e => { e.preventDefault(); g.classList.add('over'); });
    g.addEventListener('dragleave', () => g.classList.remove('over'));
    g.addEventListener('drop', e => { e.preventDefault(); placeDrag(n, e.dataTransfer.getData('text/plain')); });
    g.addEventListener('click', () => {
      if(dragSel){ placeDrag(n, dragSel); return; }
      if(X.answers[n]){ placeDrag(n, ''); return; }
      goQ(n, false);
    });
  }
  if(!X.review) return g;
  const f = document.createDocumentFragment(); f.append(g, reviewMark(n)); return f;
}
function placeDrag(n, val){
  for(const k in X.answers) if(val && X.answers[k] === val && T.paperDragOnce && +k !== n) X.answers[k] = '';
  X.answers[n] = val; dragSel = null;
  saveAttempt(); renderRight(true); renderNav(); goQ(n, false);
}
function dragBlock(b){
  T.paperDragOnce = !b.reuse;
  const used = new Set(b.n.map(n => X.answers[n]).filter(Boolean));
  const opts = h('div', {class: 'dragopts'}, b.title ? h('h5', null, b.title) : null);
  b.o.forEach(o => {
    if(used.has(o) && !b.reuse) return;
    const c = h('span', {class: 'dragopt' + (dragSel === o ? ' sel' : ''), draggable: X.review ? null : 'true'}, o);
    if(!X.review){
      c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', o); });
      c.addEventListener('click', () => { dragSel = dragSel === o ? null : o; renderRight(true); });
    }
    opts.append(c);
  });
  return h('div', {class: 'dragwrap'}, fillGaps(b.html), opts);
}

function setAnswer(n, v){
  X.answers[n] = v;
  renderNav(); saveAttempt();
}

function goQ(n, focus){
  if(T.isW){ X.task = n; renderRight(); renderNav(); saveAttempt(); if(focus){ const ta = $('#xRight textarea'); if(ta) ta.focus(); } return; }
  if(n < 1 || n > T.Q.length) return;
  X.cur = n;
  renderRight();
  $$('#xRight .cur').forEach(e => e.classList.remove('cur'));
  const el = $('#xRight [data-qs~="' + n + '"]');
  renderNav();
  if(el){
    el.classList.add('cur');
    el.scrollIntoView({block: 'nearest'});
    if(focus && el.matches('input.gap') && !el.disabled) el.focus();
  }
  saveAttempt();
}

/* ---------- нижняя полоса: номера вопросов, Review, стрелки ---------- */
function renderNav(){
  const ul = $('#xParts'); ul.innerHTML = '';
  $('#xQNav').classList.toggle('summary', !!X.navSummary);
  const items = T.isW
    ? [1, 2].map(k => ({n: k, ans: wordCount(X.writing[k]) > 0, flag: X.flags['t' + k], cur: X.task === k}))
    : T.Q.map(q => ({n: q.n, ans: !!(X.answers[q.n] || '').trim(), flag: X.flags[q.n], cur: q.n === X.cur, part: q.part}));
  let lastPart = 0;
  items.forEach(it => {
    const c = [];
    if(it.ans) c.push('answered');
    if(it.cur) c.push('current');
    if(it.flag) c.push('review');
    if(X.review && !T.isW){ const r = X.res[it.n]; if(r === 'ok') c.push('r-ok'); else if(r === 'bad' || r === 'empty') c.push('r-bad'); }
    if(it.part !== undefined && it.part !== lastPart){ c.push('newpart'); lastPart = it.part; }
    ul.append(h('li', {class: c.join(' '), title: (T.isW ? 'Part ' : 'Question ') + it.n, onclick: () => goQ(it.n, true)}, h('span', null, it.n)));
  });
  const first = T.isW ? X.task === 1 : X.cur === 1, last = T.isW ? X.task === 2 : X.cur === T.Q.length;
  $('#xPrev').classList.toggle('hidden', first);
  const nx = $('#xNext');
  nx.innerHTML = last ? ICO.finish : ICO.next;
  nx.title = last ? 'Finish the test' : 'Next';
  nx.classList.toggle('hidden', !!(X.review && last));
  $('#xReview').checked = !!(T.isW ? X.flags['t' + X.task] : X.flags[X.cur]);
  $('#xReview').disabled = !!X.review;
}

/* ---------- Writing ---------- */
function renderWritingTask(R){
  const k = X.task;
  const ta = h('textarea', {class: 'wta', spellcheck: 'false', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'off',
    readonly: X.review || null});
  ta.value = X.writing[k] || '';
  const wc = h('div', {class: 'wcount'});
  const upd = () => { wc.textContent = 'Word count: ' + wordCount(ta.value); };
  ta.addEventListener('input', () => { X.writing[k] = ta.value; upd(); renderNav(); saveAttempt(); });
  upd();
  R.append(h('div', {class: 'wtask'}, ta, wc));
}

/* ---------- сдача ---------- */
async function askSubmit(){
  let html;
  if(T.isW){
    html = '<p>Part 1: <b>' + wordCount(X.writing[1]) + '</b> words. Part 2: <b>' + wordCount(X.writing[2]) + '</b> words.</p>';
  } else {
    const un = T.Q.filter(q => !(X.answers[q.n] || '').trim()).map(q => q.n);
    const fl = T.Q.filter(q => X.flags[q.n]).map(q => q.n);
    html = '<p>You have answered <b>' + (T.Q.length - un.length) + '</b> of <b>' + T.Q.length + '</b> questions.</p>' +
      (un.length ? '<p>Unanswered: ' + un.join(', ') + '</p>' : '') +
      (fl.length ? '<p>Marked for review: ' + fl.join(', ') + '</p>' : '');
  }
  html += '<p>Once you submit, you cannot change your answers.</p>';
  const ok = await xDialog('Finish the test', html, [['Return to test', false], ['Submit', true]], {closeValue: false});
  if(ok) finishAttempt();
}

/* ---------- аудио Listening ---------- */
let audioURLs = [], audioDur = [];
function setupAudio(){
  const au = $('#xAudio');
  au.pause(); audioURLs.forEach(u => URL.revokeObjectURL(u)); audioURLs = []; audioDur = [];
  $('#xVolBox').classList.toggle('hidden', !T.hasAudio);
  if(!T.hasAudio) { au.removeAttribute('src'); return; }
  audioURLs = T.test.audio.map(a => URL.createObjectURL(a.blob));
  au.volume = +$('#xVol').value;
  // скорость: на «экзамене» всегда обычная, в тренировке — как выбрал ученик
  au.defaultPlaybackRate = au.playbackRate = (X.mode === 'practice' && X.apRate) || 1;
  // длительности всех дорожек — для таймера
  audioURLs.forEach((u, i) => { const a = new Audio(); a.preload = 'metadata';
    a.onloadedmetadata = () => { audioDur[i] = a.duration; }; a.src = u; });
  if(X.phase === 'main') playTrack(X.audioIdx, X.audioTime);
}
function playTrack(i, time, autoplay){
  const au = $('#xAudio');
  X.audioIdx = i;
  au.src = audioURLs[i];
  au.onloadedmetadata = () => { if(time) au.currentTime = Math.min(time, au.duration - 0.5); };
  au.onended = () => {
    if(X.audioIdx < audioURLs.length - 1){ X.audioTime = 0; playTrack(X.audioIdx + 1, 0); }
    else if(X.mode === 'strict' && !X.review){ X.phase = 'check'; xAlert('Recording finished. You have 2 minutes to check your answers.'); saveAttempt(); }
  };
  const tl = $('#xTrackLab'); if(tl) tl.textContent = 'Track ' + (i + 1) + ' / ' + audioURLs.length + ': ' + T.test.audio[i].name;
  const sel = $('#xTrackSel'); if(sel) sel.value = i;
  if(autoplay === undefined) autoplay = X.mode === 'strict' || time !== undefined;
  if(autoplay) au.play().catch(err => {
    if(!err || err.name !== 'NotAllowedError') return;   // запуск прервали паузой — это не ошибка
    modal('Sound', '<p>Click the button to start the recording.</p>', [{text: '▶ Play', cls: 'primary', value: 1}]).then(() => au.play());
  });
}
/* Плеер для тренировки и разбора: точная перемотка, скорость, полоса с подсказкой времени.
   В режиме «как на экзамене» его нет — запись играет один раз, как на настоящем IELTS. */
const AP_STEPS = [-10, -3, 3, 10];
const AP_RATES = [0.75, 0.9, 1, 1.25];
let apDragging = false;
function buildAudioBar(){
  const au = $('#xAudio'); au.controls = false;
  const bar = h('div', {class: 'audiobar', id: 'xAudioBar'});
  if(T.test.audio.length > 1){
    bar.append(h('div', {class: 'tr'}, h('select', {id: 'xTrackSel',
      onchange: e => { X.audioTime = 0; playTrack(+e.target.value, 0, !au.paused); e.target.blur(); }},
      T.test.audio.map((a, i) => h('option', {value: i}, 'Track ' + (i + 1) + ': ' + a.name)))));
  }
  const step = s => h('button', {class: 'ap-btn', title: (s < 0 ? 'Back ' : 'Forward ') + Math.abs(s) + ' seconds' +
      (Math.abs(s) === 3 ? '  (← →)' : '  (Shift + ← →)'),
    onclick: e => { apSeek(s); e.currentTarget.blur(); }}, s < 0 ? '« ' + (-s) + ' s' : s + ' s »');
  const play = h('button', {class: 'ap-btn ap-play', id: 'apPlay', title: 'Play / Pause  (Space)',
    onclick: e => { apToggle(); e.currentTarget.blur(); }}, '▶');
  const rate = X.apRate || 1;
  au.defaultPlaybackRate = au.playbackRate = rate;
  const speed = h('div', {class: 'ap-speed', title: 'Playback speed'}, AP_RATES.map(r =>
    h('button', {class: r === rate ? 'on' : '', 'data-r': r, onclick: e => {
      X.apRate = r; au.defaultPlaybackRate = au.playbackRate = r;
      speed.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.r === r));
      e.currentTarget.blur(); saveAttempt();
    }}, r + '×')));
  const line = h('input', {type: 'range', id: 'apLine', min: 0, max: 1, step: 0.1, value: 0, 'aria-label': 'Position'});
  const tip = h('div', {class: 'ap-tip hidden'});
  line.addEventListener('pointerdown', () => { apDragging = true; });
  line.addEventListener('input', () => { au.currentTime = +line.value; apUpdate(); });
  line.addEventListener('change', () => { apDragging = false; line.blur(); });
  line.addEventListener('pointermove', e => {          // подсказка: какое время под мышью
    const r = line.getBoundingClientRect(), d = au.duration || 0;
    if(!d) return;
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    tip.textContent = fmtClock(x / r.width * d); tip.style.left = x + 'px'; tip.classList.remove('hidden');
  });
  line.addEventListener('pointerleave', () => tip.classList.add('hidden'));
  bar.append(
    h('div', {class: 'ap-row'}, step(-10), step(-3), play, step(3), step(10),
      h('span', {class: 'ap-time', id: 'apTime'}, '0:00 / 0:00'), speed),
    h('div', {class: 'ap-line'}, line, tip),
    h('div', {class: 'ap-hint'}, 'Space — play / pause  ·  ← → — 3 s  ·  Shift + ← → — 10 s'));
  if(!au._apBound){                                   // обработчики вешаем на плеер один раз
    au._apBound = true;
    ['timeupdate', 'play', 'pause', 'loadedmetadata', 'durationchange', 'seeked'].forEach(ev => au.addEventListener(ev, apUpdate));
  }
  requestAnimationFrame(apLoop);
  return bar;
}
function apToggle(){
  const au = $('#xAudio');
  if(!au.src) return;
  if(au.paused) au.play().catch(() => {}); else au.pause();
}
function apSeek(d){
  const au = $('#xAudio');
  if(!au.src || !isFinite(au.duration)) return;
  au.currentTime = Math.min(Math.max(au.currentTime + d, 0), Math.max(0, au.duration - 0.05));
  apUpdate();
}
function apUpdate(){
  const au = $('#xAudio'), line = $('#apLine');
  if(!line) return;
  const d = isFinite(au.duration) ? au.duration : 0;
  line.max = d || 1;
  if(!apDragging) line.value = au.currentTime || 0;
  $('#apTime').textContent = fmtClock(au.currentTime || 0) + ' / ' + fmtClock(d);
  $('#apPlay').textContent = au.paused ? '▶' : '❚❚';
}
function apLoop(){                                    // плавное движение полосы во время игры
  if(!$('#apLine')) return;
  if(!$('#xAudio').paused) apUpdate();
  requestAnimationFrame(apLoop);
}
document.addEventListener('pointerup', () => { apDragging = false; });
/* горячие клавиши — только когда курсор не в поле ответа */
document.addEventListener('keydown', e => {
  if(!$('#xAudioBar') || $('#exam').classList.contains('hidden') || $('#modalRoot').children.length || $('.xov')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.closest && e.target.closest('input,textarea,select,button,[contenteditable]')) return;
  if(e.code === 'Space'){ e.preventDefault(); apToggle(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); apSeek(e.shiftKey ? -10 : -3); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); apSeek(e.shiftKey ? 10 : 3); }
});

function xAlert(text){
  const t = h('div', {class: 'toast', style: 'top:64px;bottom:auto;background:#ffd54f;color:#000;font-weight:700'}, text);
  document.body.append(t); setTimeout(() => t.remove(), 6000);
}

/* ---------- сдача ---------- */
function autoSubmit(){

}
function stopExam(){

function finishAttempt(){
  stopExam();
  X.finished = true; X.finishedAt = Date.now();
  LS.del('ielts_attempt');
  const rec = {id: X.id, date: X.finishedAt, name: X.name, title: T.test.title, module: T.test.module};
  if(T.isW){
    rec.words = 'T1: ' + wordCount(X.writing[1]) + ', T2: ' + wordCount(X.writing[2]);
    rec.band = null;
  } else Object.assign(rec, scoreAttempt());
  Hist.add(rec);
  renderResults();
}
function scoreAttempt(){
  X.res = checkAll(T.Q, X.answers);
  if(!T.hasKey) return {score: null, total: T.Q.length, band: null, wrong: ''};
  const score = T.Q.filter(q => X.res[q.n] === 'ok').length;
  const total = T.Q.filter(q => q.key).length;   // вопросы без ключа не считаем
  const table = T.test.module === 'listening' ? 'listening' : (T.test.readingType === 'general' ? 'general' : 'academic');
  const band = isShortTest() ? null : toBand(table, score, total);
  const wrong = T.Q.filter(q => X.res[q.n] === 'bad' || X.res[q.n] === 'empty').map(q => q.n).join(', ');
  return {score, total, band, wrong};
}

function isShortTest(){ return T.Q.length < 30; }

/* ---------- маркер (выделение текста в PDF) ---------- */
let popEl = null;
function hidePop(){ if(popEl){ popEl.remove(); popEl = null; } }
function showPop(x, y, items){
  hidePop();
  popEl = h('div', {class: 'hlpop', onmousedown: e => e.preventDefault()});
  items.forEach(([label, fn]) => popEl.append(h('button', {onclick: () => { fn(); hidePop(); }}, label)));
  document.body.append(popEl);
  const w = popEl.offsetWidth;
  popEl.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, x - w / 2)) + 'px';
  popEl.style.top = Math.max(4, y - 46) + 'px';
}
function onExamMouseUp(e){
  if($('#exam').classList.contains('hidden')) return;
  if(popEl && popEl.contains(e.target)) return;
  setTimeout(() => {
    const sel = window.getSelection();
    // выделение в тексте задания на экране (внутри одного куска текста)
    if(sel && !sel.isCollapsed && sel.rangeCount && $('#xRight').contains(sel.anchorNode)){
      const r = sel.getRangeAt(0), node = r.startContainer;
      if(node === r.endContainer && node.nodeType === 3 && !node.parentElement.closest('input,textarea,.dragopt,.gap')){
        showPop(e.clientX, e.clientY, [['Highlight', () => {
          const m = document.createElement('mark'); m.className = 'hl'; r.surroundContents(m); sel.removeAllRanges();
        }]]);
        return;
      }
    }
    if(e.target.matches && e.target.matches('#xRight mark.hl')){
      const m = e.target;
      showPop(e.clientX, e.clientY, [['Clear', () => m.replaceWith(document.createTextNode(m.textContent))]]);
      return;
    }
    if(!XV){ hidePop(); return; }
    const rects = XV.selectionRects();
    if(rects){
      showPop(e.clientX, e.clientY, [
        ['Highlight', () => { XV.addHl(rects); window.getSelection().removeAllRanges(); saveAttempt(); }],
        ['Clear', () => { XV.clearHl(rects); window.getSelection().removeAllRanges(); saveAttempt(); }]]);
      return;
    }
    const hit = XV.scroller.contains(e.target) ? XV.hlAt(e.clientX, e.clientY) : null;
    if(hit) showPop(e.clientX, e.clientY, [['Clear highlight', () => { XV.clearHl(hit); saveAttempt(); }]]);
    else hidePop();
  }, 0);
}

   ===================================================================== */
const toDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
async function fromDataURL(u){
  try{ return await (await fetch(u)).arrayBuffer(); }
  catch(e){
    const b64 = u.slice(u.indexOf(',') + 1), bin = atob(b64), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr.buffer;
  }
}
async function exportTest(id){
