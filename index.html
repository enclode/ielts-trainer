  const out = Object.assign({}, t);
  out.tasksPdf = t.tasksPdf ? {name: t.tasksPdf.name, data: await toDataURL(new Blob([t.tasksPdf.data], {type: 'application/pdf'}))} : null;
  out.answersPdf = t.answersPdf ? {name: t.answersPdf.name, data: await toDataURL(new Blob([t.answersPdf.data], {type: 'application/pdf'}))} : null;
  out.audio = [];
  for(const a of (t.audio || [])) out.audio.push({name: a.name, data: await toDataURL(a.blob)});
  const json = JSON.stringify({format: 'ielts-cd-trainer', version: 1, test: out});
  download((t.title || 'ielts-test').replace(/[\\/:*?"<>|]+/g, '_') + '.ielts.json', json, 'application/json');
}
/* Чтение .zip прямо в браузере (без распаковки на компьютере).
   Поддерживаются обычные архивы Windows / macOS: без сжатия и со сжатием deflate. */
async function readZip(file){
  if(typeof DecompressionStream === 'undefined') throw new Error(tr('zipUnsupported'));
  const buf = await file.arrayBuffer(), dv = new DataView(buf), dec = new TextDecoder();
  let eocd = -1;
  for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 22 - 65535); i--)
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if(eocd < 0) throw new Error(tr('zipBad'));
  let count = dv.getUint16(eocd + 10, true), cdOff = dv.getUint32(eocd + 16, true);
  if((cdOff === 0xFFFFFFFF || count === 0xFFFF) && eocd >= 20 && dv.getUint32(eocd - 20, true) === 0x07064b50){   // zip64
    const z = Number(dv.getBigUint64(eocd - 12, true));
    count = Number(dv.getBigUint64(z + 32, true)); cdOff = Number(dv.getBigUint64(z + 48, true));
  }
  const entries = [];
  let p = cdOff;
  for(let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p + 10, true), nameLen = dv.getUint16(p + 28, true),
          extraLen = dv.getUint16(p + 30, true), comLen = dv.getUint16(p + 32, true);
    let csize = dv.getUint32(p + 20, true), usize = dv.getUint32(p + 24, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nameLen));
    for(let e = p + 46 + nameLen; e < p + 46 + nameLen + extraLen; ){          // zip64: большие размеры
      const id = dv.getUint16(e, true), len = dv.getUint16(e + 2, true);
      if(id === 1){ let q = e + 4;
        if(usize === 0xFFFFFFFF){ usize = Number(dv.getBigUint64(q, true)); q += 8; }
        if(csize === 0xFFFFFFFF){ csize = Number(dv.getBigUint64(q, true)); q += 8; }
        if(lho === 0xFFFFFFFF){ lho = Number(dv.getBigUint64(q, true)); } }
      e += 4 + len;
    }
    entries.push({name, method, csize, lho});
    p += 46 + nameLen + extraLen + comLen;
  }
  return entries.map(en => ({
    name: en.name.split('/').pop(), path: en.name,
    text: async () => {
      const start = en.lho + 30 + dv.getUint16(en.lho + 26, true) + dv.getUint16(en.lho + 28, true);
      const data = new Uint8Array(buf, start, en.csize);
      if(en.method === 0) return dec.decode(data);
      if(en.method === 8) return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      throw new Error(tr('zipBad'));
    }
  }));
}

/* один тест из текста файла .ielts.json → в библиотеку. Возвращает 'added' | 'skipped'. */
async function importTestText(text, batch){
  const j = JSON.parse(text);
  if(j.format !== 'ielts-cd-trainer' || !j.test) throw new Error(tr('notOurFile'));
  const t = j.test;
  if(await DB.get(t.id)){
    if(!batch){
      if(!(await confirmBox(tr('existsQ'), tr('existsText', esc(t.title)), tr('replace'), tr('addCopy'))))
        { t.id = uid(); t.title += tr('copySuffix'); }
    } else {
      if(batch.dup == null)                           // при загрузке многих тестов спрашиваем один раз
        batch.dup = await modal(tr('dupManyQ'), '<p>' + tr('dupManyText', esc(t.title)) + '</p>',
          [{text: tr('skipThem'), value: 'skip'}, {text: tr('replaceAll'), cls: 'primary', value: 'replace'}]);
      if(batch.dup === 'skip') return 'skipped';
    }
  }
  if(t.tasksPdf) t.tasksPdf = {name: t.tasksPdf.name, data: await fromDataURL(t.tasksPdf.data)};
  if(t.answersPdf) t.answersPdf = {name: t.answersPdf.name, data: await fromDataURL(t.answersPdf.data)};
  const au = [];
  for(const a of (t.audio || [])){ const buf = await fromDataURL(a.data); au.push({name: a.name, blob: new Blob([buf], {type: (a.data.match(/^data:([^;,]+)/) || [])[1] || 'audio/mpeg'})}); }
  t.audio = au;
  await DB.put(t);
  return 'added';
}

/* загрузка выбранных файлов: тесты .json и архивы .zip с тестами внутри, сколько угодно сразу */
async function importFiles(files){
  const items = [];
  try{
    for(const f of files){
      if(/\.zip$/i.test(f.name) || /zip/.test(f.type)){
        (await readZip(f)).filter(e => /\.json$/i.test(e.name) && !/^__MACOSX\//.test(e.path) && !e.name.startsWith('.'))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}))
          .forEach(e => items.push({name: e.name, text: e.text}));
      } else items.push({name: f.name, text: () => f.text()});
    }
  }catch(e){ return modal(tr('loadFail'), '<p>' + esc(e.message) + '</p>'); }
  if(!items.length) return modal(tr('loadFail'), '<p>' + tr('zipNoTests') + '</p>');
  const batch = items.length > 1 ? {dup: null} : null;
  const prog = h('div', {class: 'toast'}); document.body.append(prog);
  let added = 0, skipped = 0; const failed = [], names = [];
  for(let i = 0; i < items.length; i++){
    prog.textContent = tr('importing', i + 1, items.length);
    try{
      const text = await items[i].text();
      const r = await importTestText(text, batch);
      if(r === 'added'){ added++; try{ names.push(JSON.parse(text).test.title); }catch(e){} } else skipped++;
    }catch(e){ failed.push(items[i].name + ' — ' + e.message); }
  }
  prog.remove();
  await renderHome();
  if(!batch && added && !failed.length) return toast(tr('added', names[0] || ''));
  let html = '<p><b>' + tr('importDone', added) + '</b></p>';
  if(skipped) html += '<p>' + tr('importSkipped', skipped) + '</p>';
  if(failed.length) html += '<p class="c-bad">' + tr('importFailed', failed.length) + '</p><ul>' + failed.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  modal(null, html);
}

    edSyncModule(); edKeyPreview();
  });
  $$('#edRtype button').forEach(b => b.onclick = () => { ED.readingType = b.dataset.v; edSyncModule(); });
  $('#edTasksFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    ED.tasksPdf = {name: f.name, data: await readFileBuf(f)}; ED.tasksPages = null;
    try{ const d = await openPdf(ED.tasksPdf.data); ED.tasksPages = d.numPages; if(!$('#edTo').value) $('#edTo').value = d.numPages; }catch(err){ toast(tr('pdfOpenFail')); }
    if(!$('#edName').value) $('#edName').value = f.name.replace(/\.pdf$/i, '') + ' — ' + MOD_NAME[ED.module];
    edFileInfo();
  };
  $('#edAnsFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    ED.answersPdf = {name: f.name, data: await readFileBuf(f)}; ED.ansPages = null;
    try{ const d = await openPdf(ED.answersPdf.data); ED.ansPages = d.numPages; if(!$('#edATo').value) $('#edATo').value = d.numPages; }catch(err){ toast(tr('pdfOpenFail')); }
    edFileInfo();
  };
  $('#edAudioFile').onchange = e => {
    const fs = Array.from(e.target.files).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
    ED.audio = (ED.audio || []).concat(fs.map(f => ({name: f.name, blob: f})));
    e.target.value = ''; edFileInfo();
  };
  $('#edPreviewTasks').onclick = () => previewPdf(ED.tasksPdf && ED.tasksPdf.data, tr('prevTasks', ED.tasksPdf ? ED.tasksPdf.name : ''));
  $('#edPreviewAns').onclick = () => previewPdf(ED.answersPdf && ED.answersPdf.data, tr('prevAns', ED.answersPdf ? ED.answersPdf.name : ''));
  $('#edExtract').onclick = edExtract;
  $('#edKey').oninput = $('#edParts').oninput = () => { clearTimeout(ED._t); ED._t = setTimeout(edKeyPreview, 250); };
  $('#edSave').onclick = edSave;

  // перед началом
  $$('#inMode button').forEach(b => b.onclick = () => { INTRO.mode = b.dataset.v; syncIntroMode(); });
  $('#inBeep').onclick = beep;
  $('#inBack').onclick = () => renderHome();
  $('#inStart').onclick = startAttempt;
  $('#inName').onkeydown = e => { if(e.key === 'Enter') startAttempt(); };

  // экзамен
  [['.ico-person', ICO.person], ['.ico-clock', ICO.clock], ['.ico-speaker', ICO.speaker]].forEach(([c, v]) => $$(c).forEach(e => { e.innerHTML = v; }));
  $('#xSummary').innerHTML = ICO.pencil; $('#xPrev').innerHTML = ICO.prev; $('#xNext').innerHTML = ICO.next;
  $('#xHide').onclick = hideScreen;
  $('#xHelp').onclick = openHelp;
  $('#xTimerBox').onclick = () => { if(X && !X.review && !X.finished){ X.timerHidden = !X.timerHidden; onTick(); } };
  $('#xVol').oninput = e => { const au = $('#xAudio'); if(au) au.volume = +e.target.value; };
  $('#xBackRes').onclick = () => { $('#xAudio').pause(); X.review = false; renderResults(); };
  $('#xReview').onchange = e => { const k = T.isW ? 't' + X.task : X.cur; X.flags[k] = e.target.checked; renderNav(); saveAttempt(); };
  $('#xSummary').onclick = () => { X.navSummary = !X.navSummary; renderNav(); };
  $('#xPrev').onclick = () => T.isW ? goQ(Math.max(1, X.task - 1), true) : goQ(Math.max(1, X.cur - 1), true);
  $('#xNext').onclick = () => {
    const last = T.isW ? X.task === 2 : X.cur === T.Q.length;
    if(last){ if(!X.review) askSubmit(); return; }
    T.isW ? goQ(X.task + 1, true) : goQ(X.cur + 1, true);
  };
  document.addEventListener('mouseup', onExamMouseUp);
  document.addEventListener('mousedown', e => { if(popEl && !popEl.contains(e.target)) hidePop(); });
  initDivider();
  window.addEventListener('beforeunload', e => {
    if(X && !X.finished && !X.review && !$('#exam').classList.contains('hidden')){ saveAttempt(); e.preventDefault(); e.returnValue = ''; }
  });
}

/* смена языка: подписи в разметке + перерисовка открытого экрана */
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = tr('appTitle');
  $$('[data-i18n]').forEach(e => { e.textContent = tr(e.dataset.i18n); });
  $$('[data-i18n-html]').forEach(e => { e.innerHTML = tr(e.dataset.i18nHtml); });
  $$('[data-i18n-ph]').forEach(e => { e.placeholder = tr(e.dataset.i18nPh); });
  $$('#langBar button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
}
function setLang(l){
  if(!LANGS.includes(l)) return;
  LANG = l; LS.set('ielts_lang', l);
  applyLang();
  const open = ['home', 'editor', 'intro', 'results'].find(id => !$('#' + id).classList.contains('hidden'));
  const y = window.scrollY;
  if(open === 'home') renderHome().then(() => window.scrollTo(0, y));
  else if(open === 'editor'){ edSyncModule(); edFileInfo(); edKeyPreview(); }
  else if(open === 'intro') fillIntro();
  else if(open === 'results'){ renderResults(); window.scrollTo(0, y); }
}

(async function init(){
  LANG = LS.get('ielts_lang', 'uz');
  if(!LANGS.includes(LANG)) LANG = 'uz';
  applyLang();
  $$('#langBar button').forEach(b => b.onclick = () => setLang(b.dataset.l));
  bindUI();
  await DB.open();
  renderHome();
})();
</script>
</body>
